<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduConnect</title>
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="logo">
          <span>
            <img src="../media/EduConnect-logo.png" alt="" srcset=""
          /></span>
        </div>

        <div>
          <ul class="nav-lists">
            <div class="center-nav">
              <li class="nav-items"><a href="#">Home</a></li>
              <li class="nav-items"><a href="#">Courses</a></li>
              <li class="nav-items"><a href="#">Registration Form</a></li>
            </div>

            <div class="right-nav">
              <li class="nav-items">
                <span
                  ><input
                    type="search"
                    name=""
                    id=""
                    placeholder="Search"
                    class="search"
                /></span>
              </li>
              <li class="nav-items">
                <a href="#"
                  ><input type="button" value="Login" class="btn btn-login"
                /></a>
              </li>
              <li class="nav-items">
                <a href="#"
                  ><input type="button" value="Sign-Up" class="btn btn-signup"
                /></a>
              </li>
            </div>
          </ul>
        </div>
      </nav>
    </header>

    <main class="main-container">
      <div class="hero-section">
        <div class="left-section">
          <div class="title">
            <h1><span class="title-first">Better Learning</span></h1>
            <h1><span class="title-second">Brighter Future</span></h1>
            <span class="description"
              >Expert guidance, Smart strategies. Personal attention. Your
              success is our mission</span
            >
          </div>
          <div>
            <input type="button" value="Explore Courses" />
            <input type="button" value="Contact Us" />
          </div>
        </div>
        <div class="right-section">
          <div class="right-section-experiance-stat">
            <div><h1>20 +</h1></div>
            <div><span>YEARS OF EXECELLENCE</span></div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
