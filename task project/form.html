<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Form</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- ================================= menubar header =========================== -->
    <header>
      <nav class="navbar">
        <div class="logo">
          <span><img src="./logo-task.webp" alt="LOGO" /></span>
        </div>
        <div class="nav-right">
          <ul class="nav-links">
            <li class="nav-items"><a href="./form.html">Create Task</a></li>
            <li class="nav-items"><a href="./index.html">Task List</a></li>
          </ul>
        </div>
      </nav>
    </header>
    <main class="main-container">
      <div class="form-section">
        <h3>Add a Task:</h3>
        <hr />
        <!-- ============================= form form section ==================== -->
        <form action="">
          <div>
            <label for="">Task Name:</label>
            <input type="text" class="input-txt" />
          </div>
          <div>
            <label for="">Give Priority:</label>
            <select name="" id="">
              <option value="" selected>--Select Priority here--</option>
              <option value="">Low</option>
              <option value="">Medium</option>
              <option value="">High</option>
              <option value="">Very High</option>
              <option value="">Emergency</option>
            </select>
          </div>
          <div class="btn-submit-div">
            <button type="submit" id="submit-btn" class="btn btn-submit">
              Add To Task List
            </button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
